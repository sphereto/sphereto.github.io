<style>
  :root { --accent: #7c3aed; --accent-soft: #a78bfa; }
  .js:not(.ready) #c { visibility: hidden; }   /* no flash of the finished page before the intro starts */
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: var(--accent); color: #fff; }

  /* locked in place: no scroll, no rubber-band */
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    background: #000; color: #fff;
  }
  body {
    display: grid; place-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* faint violet glow behind the text */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(38rem 26rem at 50% 45%, rgba(124,58,237,.14), transparent 70%);
  }

  #c { width: min(100%, 36rem); }
  #t {
    width: 100%;
    font-size: clamp(1.15rem, 1rem + 0.9vw, 1.6rem);
    line-height: 1.55;
    font-weight: 400;
  }
  #t .line { display: block; white-space: nowrap; }
  #t .w { display: inline-block; white-space: pre; }
  #t .hello { font-weight: 500; will-change: transform, opacity; }

  /* soft left-to-right gradient-mask sweep (--p = position of the leading edge) */
  #t .mask {
    --p: -30%;
    display: inline-block;
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 var(--p), transparent calc(var(--p) + 30%));
            mask-image: linear-gradient(90deg, #000 0, #000 var(--p), transparent calc(var(--p) + 30%));
    will-change: filter;
  }
  .js #t .mask:not(.go):not(.done) { opacity: 0; }   /* hidden until its own sweep begins */
  .js #t .hello { opacity: 0; }                        /* "Hello!" is shown by the script */
  #t .mask.done { -webkit-mask-image: none; mask-image: none; filter: none; will-change: auto; }

  /* highlighter pen: ONE continuous band behind each phrase, wiped in left -> right.
     Solid colours (no transparency) so pieces of a phrase can never double up where they meet. */
  #t .hl {
    position: relative; isolation: isolate;
    display: inline-block;
    line-height: 1.15;
    padding: 0.04em 0;
    --hd: 0ms; --hl: 0ms; --gl: 0ms; --he: linear;
  }
  /* only the outer ends of a band get breathing room; the margin cancels it so text never shifts */
  #t .hl-first { padding-left: 0.12em;  margin-left: -0.12em; }
  #t .hl-last  { padding-right: 0.12em; margin-right: -0.12em; }
  #t .hl::before {
    content: ""; position: absolute; z-index: -1;
    inset: 36% -0.03em 2% -0.03em;                       /* tiny overlap hides sub-pixel seams between words */
    background: #5b21b6;                                 /* 10:1 with white */
    clip-path: inset(-120% 100% -120% -120%);            /* empty, anchored left */
    transition: clip-path var(--hd) var(--he) var(--hl);
  }
  #t .hl-name::before { background: var(--accent); }     /* the name gets the brighter violet */
  #t .hl.on::before {
    clip-path: inset(-120% -120% -120% -120%);           /* fully drawn */
    animation: glow 1100ms ease-in-out var(--gl) both;
  }

  /* multi-word phrases: one continuous band, only the outer ends are rounded */
  #t .hl:not(.hl-solo)::before { border-radius: 0; }
  #t .hl-first:not(.hl-solo)::before { border-radius: 0.2em 0 0 0.2em; }
  #t .hl-last:not(.hl-solo)::before  { border-radius: 0 0.2em 0.2em 0; }
  #t .hl-first.hl-last::before { border-radius: 0.2em; }

  /* one brief brightening of the band at the halfway point of the wipe (no shadows, so no seams) */
  @keyframes glow {
    0%   { filter: brightness(1); }
    45%  { filter: brightness(1.5) saturate(1.1); }
    100% { filter: brightness(1); }
  }
  #t .hl.now::before { transition: none !important; animation: none !important; }

  /* links */
  #links { margin-top: clamp(1.5rem, 4vh, 2.25rem); }
  #links .rule { height: 1px; background: rgba(255,255,255,.22); transform-origin: left; transition: transform 900ms cubic-bezier(.6,0,.2,1); }
  #links .icons { display: flex; gap: 0.2rem; padding-top: 0.7rem; margin-left: -0.65rem; }
  #links a {
    --d: 0s;
    width: 2.75rem; height: 2.75rem; display: grid; place-items: center;   /* ~44px touch target */
    color: #fff; opacity: .75; border-radius: .7rem;
    transition: opacity .6s ease var(--d), transform .6s cubic-bezier(.2,.7,.2,1) var(--d), color .25s ease;
  }
  #links a svg { width: 1.45rem; height: 1.45rem; fill: currentColor; }
  #links a:hover { opacity: 1; color: var(--accent-soft); transform: translateY(-2px); }
  #links a:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .js #links:not(.go) .rule { transform: scaleX(0); }
  .js #links:not(.go) a { opacity: 0; transform: translateY(8px); pointer-events: none; }
</style>

<body>
<main id="c">
<p id="t">Hello! I’m Sphereto, a student who is curious, open-minded, and always eager to learn. I enjoy exploring different interests, developing new skills, and challenging myself to become a better version of who I am.</p>

<script>
(function () {
  var p = document.getElementById('t');
  var text = p.textContent.trim();
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [], masks = [], groups = [], hello, anims = [], raf = 0;

  // What gets highlighted: your name (solid) and a few key points (soft)
  var PHRASES = [
    { k: 'name', w: ['Sphereto'] },
    { k: 'pt',   w: ['curious'] },
    { k: 'pt',   w: ['open-minded'] },
    { k: 'pt',   w: ['eager', 'to', 'learn'] },
    { k: 'pt',   w: ['better', 'version'] }
  ];

  // Block touch scrolling / rubber-banding (iOS ignores CSS alone)
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  function split() {
    p.textContent = '';
    var words = text.split(' ');
    var toks = words.map(function (w) { var m = w.match(/^(.*?)([.,!?;:]*)$/); return { core: m[1], punct: m[2] }; });

    // find each phrase in the word list
    var info = [], gl = [];
    PHRASES.forEach(function (ph, pid) {
      for (var i = 0; i <= toks.length - ph.w.length; i++) {
        var ok = ph.w.every(function (c, j) { return toks[i + j].core === c; });
        if (ok) {
          gl[pid] = { k: ph.k, els: [] };
          ph.w.forEach(function (c, j) { info[i + j] = { pid: pid, k: ph.k, idx: j, n: ph.w.length }; });
          break;
        }
      }
    });

    var spans = [];
    words.forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'w' + (i === 0 ? ' hello' : '');
      var last = i === words.length - 1, f = info[i];
      if (f) {
        var inner = document.createElement('span');
        inner.className = 'hl hl-' + f.k + (f.idx === 0 ? ' hl-first' : '') + (f.idx === f.n - 1 ? ' hl-last' : '') + (f.n === 1 ? ' hl-solo' : '');
        inner.textContent = toks[i].core + (f.idx < f.n - 1 ? ' ' : '');
        s.appendChild(inner);
        s.appendChild(document.createTextNode(toks[i].punct + (f.idx === f.n - 1 && !last ? ' ' : '')));
        gl[f.pid].els.push(inner);
      } else {
        s.textContent = w + (last ? '' : ' ');
      }
      p.appendChild(s); spans.push(s);
    });

    // group words into the lines the browser really wraps
    var rows = [], top = null;
    spans.forEach(function (s) {
      if (s.offsetTop !== top) { rows.push([]); top = s.offsetTop; }
      rows[rows.length - 1].push(s);
    });
    p.textContent = '';
    masks = [];
    rows.forEach(function (g) {
      var line = document.createElement('span'); line.className = 'line';
      var m = document.createElement('span'); m.className = 'mask';
      g.forEach(function (s) {
        if (s.classList.contains('hello')) line.appendChild(s); else m.appendChild(s);
      });
      line.appendChild(m); p.appendChild(line); masks.push(m);
    });
    groups = gl.filter(Boolean);
    groups.forEach(function (g) {
      for (var i = 1; i < g.els.length; i++) {
        var x = g.els[i - 1], y = g.els[i];
        if (x.closest('.mask') !== y.closest('.mask')) {
          x.classList.add('hl-last'); y.classList.add('hl-first');
          x.textContent = x.textContent.trimEnd();
          x.nextSibling.nodeValue = ' ' + x.nextSibling.nodeValue;
        }
      }
    });
    hello = p.querySelector('.hello');
  }

  function showAll() {
    cancelAnimationFrame(raf); anims = [];
    masks.forEach(function (m) { m.classList.add('done'); });
    groups.forEach(function (g) { g.els.forEach(function (e) { e.classList.add('now', 'on'); }); });
    hello.style.transition = 'none'; hello.style.transform = 'none'; hello.style.opacity = 1;
    linksEl.classList.add('go');
  }

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  // Left -> right sweep of the text; blur sharpens as the edge passes
  function tick(now) {
    var alive = false;
    anims.forEach(function (a) {
      if (a.done) return;
      var t = (now - a.start) / a.dur;
      if (t < 0) { alive = true; return; }
      a.el.classList.add('go');
      if (t >= 1) { a.el.classList.add('done'); a.done = true; return; }
      var e = 1 - Math.pow(1 - t, 3);
      a.el.style.setProperty('--p', (-30 + 130 * e) + '%');
      a.el.style.filter = 'blur(' + (5 * (1 - e)).toFixed(2) + 'px)';
      alive = true;
    });
    if (alive) raf = requestAnimationFrame(tick);
  }

  // Highlighter: every phrase wipes in left -> right at the same time and glows once
  // at the halfway point. Returns how long the wipe takes.
  var HD = 750;   // same speed for every highlight
  function highlight() {
    groups.forEach(function (g) {
      var total = g.els.reduce(function (s, e) { return s + e.textContent.trim().length; }, 0);
      var cum = 0, solo = g.els.length === 1;
      g.els.forEach(function (e) {
        var share = e.textContent.trim().length / total;
        e.style.setProperty('--hd', (HD * share) + 'ms');
        e.style.setProperty('--hl', (HD * cum) + 'ms');
        e.style.setProperty('--gl', (HD * 0.5) + 'ms');
        e.style.setProperty('--he', solo ? 'cubic-bezier(.55,0,.15,1)' : 'linear');
        e.classList.add('on');
        cum += share;
      });
    });
    return HD;
  }

  // Divider line draws in, then the icons rise in one by one
  var linksEl = document.getElementById('links');
  function showLinks() {
    var icons = linksEl.querySelectorAll('a');
    Array.prototype.forEach.call(icons, function (a, i) { a.style.setProperty('--d', (0.25 + i * 0.12) + 's'); });
    linksEl.classList.add('go');
    later(function () {
      Array.prototype.forEach.call(icons, function (a) { a.style.removeProperty('--d'); });
    }, 1800);
  }

  function play() {
    // 1. only "Hello!" exists, big, in the middle of the screen
    var r = hello.getBoundingClientRect();
    var dx = innerWidth / 2 - (r.left + r.width / 2);
    var dy = innerHeight / 2 - (r.top + r.height / 2);
    hello.style.transition = 'none';
    hello.style.opacity = 0;
    hello.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(2.4)';
    void p.offsetWidth;

    later(function () { hello.style.transition = 'opacity 900ms ease'; hello.style.opacity = 1; }, 300);

    // 2. it glides into its place in the sentence
    later(function () {
      hello.style.transition = 'transform 1300ms cubic-bezier(.65,0,.35,1)';
      hello.style.transform = 'none';
    }, 1900);

    // 3. the text fades in left -> right, line after line
    var T3 = 2900, GAP = 480, DUR = 1400;
    later(function () {
      var now = performance.now();
      anims = masks.map(function (m, i) { return { el: m, start: now + i * GAP, dur: DUR, done: false }; });
      raf = requestAnimationFrame(tick);
    }, T3);

    // 4. all highlights start together, the moment the last highlighted word has
    //    appeared, while the rest of the text is still fading in
    var tH = 0;
    groups.forEach(function (g) {
      g.els.forEach(function (e) {
        var m = e.closest('.mask'), i = masks.indexOf(m);
        var mr = m.getBoundingClientRect(), er = e.getBoundingClientRect();
        var frac = Math.min(1, Math.max(0, (er.right - mr.left) / mr.width));
        var ee = Math.min(1, (frac * 100 + 30) / 130);          // invert the sweep's easing
        var t = 1 - Math.pow(1 - ee, 1 / 3);
        tH = Math.max(tH, T3 + i * GAP + t * DUR + 60);
      });
    });
    later(highlight, tH);

    // 5. links appear once the highlights and the text have both finished
    var textEnd = T3 + (masks.length - 1) * GAP + DUR;
    later(showLinks, Math.max(tH + HD - 150, textEnd - 200));
  }

  var started = false;
  function init() {
    if (started) return; started = true;
    split();
    if (reduced) showAll(); else play();
    document.documentElement.classList.add('ready');   // reveal only now, already in its starting state
  }

  // Wait for the font so line breaks are measured correctly
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
  setTimeout(init, 2500);   // fallback if the font is slow

  // On resize, re-detect lines and show the finished state
  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      timers.forEach(clearTimeout); timers = [];
      split(); showAll();
    }, 200);
  });
})();
</script>
