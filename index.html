<style>
  :root { --accent: #7c3aed; --accent-soft: #a78bfa; }
  .js:not(.ready) #c { visibility: hidden; }   /* no flash of the finished page before the intro starts */
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: var(--accent); color: #fff; }

  /* locked in place: no scroll, no rubber-band */
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    background: #000; color: #fff;
  }
  body {
    display: grid; place-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* faint violet glow behind the text */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(38rem 26rem at 50% 45%, rgba(124,58,237,.14), transparent 70%);
  }

  #c { width: min(100%, 36rem); }
  #t {
    width: 100%;
    font-size: clamp(1.15rem, 1rem + 0.9vw, 1.6rem);
    line-height: 1.55;
    font-weight: 400;
  }
  #t .line { display: block; white-space: nowrap; }
  #t .w { display: inline-block; white-space: pre; }
  #t .hello { font-weight: 500; will-change: transform, opacity; }

  /* soft left-to-right gradient-mask sweep (--p = position of the leading edge) */
  #t .mask {
    --p: -30%;
    display: inline-block;
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 var(--p), transparent calc(var(--p) + 30%));
            mask-image: linear-gradient(90deg, #000 0, #000 var(--p), transparent calc(var(--p) + 30%));
    will-change: filter;
  }
  .js #t .mask:not(.go):not(.done) { opacity: 0; }   /* hidden until its own sweep begins */
  .js #t .hello { opacity: 0; }                        /* "Hello!" is shown by the script */
  #t .mask.done { -webkit-mask-image: none; mask-image: none; filter: none; will-change: auto; }

  /* shiny name */
  .shiny-text {
    position: relative;
    display: inline-block;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .shiny-text__glow {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    filter: blur(0.14em);
    pointer-events: none;
    user-select: none;
  }

  /* links */
  #links { margin-top: clamp(1.5rem, 4vh, 2.25rem); }
  #links .rule { height: 1px; background: rgba(255,255,255,.22); transform-origin: left; transition: transform 900ms cubic-bezier(.6,0,.2,1); }
  #links .icons { display: flex; gap: 0.2rem; padding-top: 0.7rem; margin-left: -0.65rem; }
  #links a {
    --d: 0s;
    width: 2.75rem; height: 2.75rem; display: grid; place-items: center;   /* ~44px touch target */
    color: #fff; opacity: .75; border-radius: .7rem;
    transition: opacity .6s ease var(--d), transform .6s cubic-bezier(.2,.7,.2,1) var(--d), color .25s ease;
  }
  #links a svg { width: 1.45rem; height: 1.45rem; fill: currentColor; }
  #links a:hover { opacity: 1; color: var(--accent-soft); transform: translateY(-2px); }
  #links a:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .js #links:not(.go) .rule { transform: scaleX(0); }
  .js #links:not(.go) a { opacity: 0; transform: translateY(8px); pointer-events: none; }
</style>

<body>

<p id="t">Hello! I’m Sphereto, a student who is curious, open-minded, and always eager to learn. I enjoy exploring different interests, developing new skills, and challenging myself to become a better version of who I am.</p>

<script>
(function () {
  var p = document.getElementById('t');
  var text = p.textContent.trim();
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [], masks = [], shinies = [], hello, anims = [], raf = 0;

  // ---- Shiny text: vanilla port of the ShinyText component (loop trigger) ----
  var NAME = 'Sphereto';
  var SHINE = { color: '#b5b5b5', shineColor: '#ffffff', speed: 5, delay: 0, angle: 120,
                shineWidth: 40, softness: 0.8, bands: 1, glow: 0.25, sign: -1 };   // sign -1 = direction "left"
  var FALLOFF = [0, 0.2, 0.4, 0.6, 0.8, 1];
  var paint = null;

  function parseColor(value) {
    if (!paint) paint = document.createElement('canvas').getContext('2d');
    if (!paint) return null;
    paint.fillStyle = '#000000';
    paint.fillStyle = value;
    var resolved = String(paint.fillStyle);
    if (resolved.charAt(0) === '#') {
      return [1, 3, 5].map(function (i) { return parseInt(resolved.slice(i, i + 2), 16); }).concat(1);
    }
    var parts = resolved.match(/[\d.]+/g);
    if (!parts || parts.length < 3) return null;
    return [Number(parts[0]), Number(parts[1]), Number(parts[2]), parts.length > 3 ? Number(parts[3]) : 1];
  }

  function blend(from, to, amount) {
    function channel(a, b) {
      return Math.round(Math.pow(Math.pow(a / 255, 2.2) * (1 - amount) + Math.pow(b / 255, 2.2) * amount, 1 / 2.2) * 255);
    }
    var alpha = from[3] * (1 - amount) + to[3] * amount;
    if (alpha <= 0) return 'rgba(0, 0, 0, 0)';
    function weigh(a, b) { return (a * from[3] * (1 - amount) + b * to[3] * amount) / alpha; }
    var same = from[3] === to[3];
    var r = same ? channel(from[0], to[0]) : Math.round(weigh(from[0], to[0]));
    var g = same ? channel(from[1], to[1]) : Math.round(weigh(from[1], to[1]));
    var b = same ? channel(from[2], to[2]) : Math.round(weigh(from[2], to[2]));
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + Math.round(alpha * 1000) / 1000 + ')';
  }

  function makeShiny(root, glowEl) {
    var o = SHINE;
    var base = parseColor(o.color), shine = parseColor(o.shineColor);
    var clear = shine ? [shine[0], shine[1], shine[2], 0] : null;
    var half = o.shineWidth / 2;
    var extent = half + (o.bands - 1) * o.shineWidth * 1.3 + 2;
    var entry = o.sign > 0 ? -extent : 100 + extent;
    var exit  = o.sign > 0 ? 100 + extent : -extent;
    var dur = o.speed * 1000, cycle = dur + o.delay * 1000;
    var raf = 0, t0 = 0, alive = true;

    function gradient(pos, fill) {
      var core = half * (1 - o.softness), fade = half - core, stops = [];
      for (var band = 0; band < o.bands; band++) {
        var center = pos - o.sign * band * o.shineWidth * 1.3;
        var strength = 1 - band * 0.28;
        [-1, 1].forEach(function (side) {
          FALLOFF.forEach(function (f) {
            stops.push([center + side * (core + fade * (1 - f)), f * f * (3 - 2 * f) * strength]);
          });
        });
      }
      stops.sort(function (a, b) { return a[0] - b[0]; });
      var list = stops.map(function (x) { return blend(fill, shine, x[1]) + ' ' + x[0].toFixed(2) + '%'; });
      return 'linear-gradient(' + o.angle + 'deg, ' + blend(fill, shine, 0) + ' 0%, ' + list.join(', ') + ', ' + blend(fill, shine, 0) + ' 100%)';
    }

    function tick(now) {
      raf = 0;
      if (!alive) return;
      var ph = (now - t0) % cycle;
      if (ph < dur) {
        var t = ph / dur, e = 0.5 - Math.cos(Math.PI * t) / 2;   // "smooth" easing
        var pos = entry + (exit - entry) * e;
        root.style.backgroundImage = gradient(pos, base);
        glowEl.style.backgroundImage = gradient(pos, clear);
        glowEl.style.opacity = String(o.glow);
      } else {
        root.style.backgroundImage = 'linear-gradient(' + o.color + ', ' + o.color + ')';
        glowEl.style.backgroundImage = 'none';
      }
      raf = requestAnimationFrame(tick);
    }

    root.style.backgroundImage = 'linear-gradient(' + o.color + ', ' + o.color + ')';
    return {
      start: function () {
        if (raf || !alive || !base || !shine || reduced) return;   // reduced motion: stays a still colour
        t0 = performance.now();
        raf = requestAnimationFrame(tick);
      },
      destroy: function () { alive = false; cancelAnimationFrame(raf); }
    };
  }

  function startShine() { shinies.forEach(function (x) { x.start(); }); }

  // Block touch scrolling / rubber-banding (iOS ignores CSS alone)
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  function split() {
    shinies.forEach(function (x) { x.destroy(); }); shinies = [];
    p.textContent = '';
    var words = text.split(' ');
    var spans = [];
    words.forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'w' + (i === 0 ? ' hello' : '');
      var last = i === words.length - 1, m = w.match(/^(.*?)([.,!?;:]*)$/);
      if (m[1] === NAME) {
        var sh = document.createElement('span'); sh.className = 'shiny-text'; sh.textContent = m[1];
        var gl = document.createElement('span'); gl.className = 'shiny-text__glow';
        gl.setAttribute('aria-hidden', 'true'); gl.textContent = m[1];
        sh.appendChild(gl);
        s.appendChild(sh);
        s.appendChild(document.createTextNode(m[2] + (last ? '' : ' ')));
        shinies.push(makeShiny(sh, gl));
      } else {
        s.textContent = w + (last ? '' : ' ');
      }
      p.appendChild(s); spans.push(s);
    });

    // group words into the lines the browser really wraps
    var rows = [], top = null;
    spans.forEach(function (s) {
      if (s.offsetTop !== top) { rows.push([]); top = s.offsetTop; }
      rows[rows.length - 1].push(s);
    });
    p.textContent = '';
    masks = [];
    rows.forEach(function (g) {
      var line = document.createElement('span'); line.className = 'line';
      var m = document.createElement('span'); m.className = 'mask';
      g.forEach(function (s) {
        if (s.classList.contains('hello')) line.appendChild(s); else m.appendChild(s);
      });
      line.appendChild(m); p.appendChild(line); masks.push(m);
    });
    hello = p.querySelector('.hello');
  }

  function showAll() {
    cancelAnimationFrame(raf); anims = [];
    masks.forEach(function (m) { m.classList.add('done'); });
    hello.style.transition = 'none'; hello.style.transform = 'none'; hello.style.opacity = 1;
    linksEl.classList.add('go');
    startShine();
  }

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  // Left -> right sweep of the text; blur sharpens as the edge passes
  function tick(now) {
    var alive = false;
    anims.forEach(function (a) {
      if (a.done) return;
      var t = (now - a.start) / a.dur;
      if (t < 0) { alive = true; return; }
      a.el.classList.add('go');
      if (t >= 1) { a.el.classList.add('done'); a.done = true; return; }
      var e = 1 - Math.pow(1 - t, 3);
      a.el.style.setProperty('--p', (-30 + 130 * e) + '%');
      a.el.style.filter = 'blur(' + (5 * (1 - e)).toFixed(2) + 'px)';
      alive = true;
    });
    if (alive) raf = requestAnimationFrame(tick);
  }

  // Divider line draws in, then the icons rise in one by one
  var linksEl = document.getElementById('links');
  function showLinks() {
    var icons = linksEl.querySelectorAll('a');
    Array.prototype.forEach.call(icons, function (a, i) { a.style.setProperty('--d', (0.25 + i * 0.12) + 's'); });
    linksEl.classList.add('go');
    later(function () {
      Array.prototype.forEach.call(icons, function (a) { a.style.removeProperty('--d'); });
    }, 1800);
  }

  function play() {
    // 1. only "Hello!" exists, big, in the middle of the screen
    var r = hello.getBoundingClientRect();
    var dx = innerWidth / 2 - (r.left + r.width / 2);
    var dy = innerHeight / 2 - (r.top + r.height / 2);
    hello.style.transition = 'none';
    hello.style.opacity = 0;
    hello.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(2.4)';
    void p.offsetWidth;

    later(function () { hello.style.transition = 'opacity 900ms ease'; hello.style.opacity = 1; }, 300);

    // 2. it glides into its place in the sentence
    later(function () {
      hello.style.transition = 'transform 1300ms cubic-bezier(.65,0,.35,1)';
      hello.style.transform = 'none';
    }, 1900);

    // 3. the text fades in left -> right, line after line
    var T3 = 2900, GAP = 480, DUR = 1400;
    later(function () {
      var now = performance.now();
      anims = masks.map(function (m, i) { return { el: m, start: now + i * GAP, dur: DUR, done: false }; });
      raf = requestAnimationFrame(tick);
    }, T3);

    // 4. links appear once the text has finished
    var textEnd = T3 + (masks.length - 1) * GAP + DUR;
    later(showLinks, textEnd - 200);
    later(startShine, textEnd);   // name starts to shine once the text is fully in
  }

  var started = false;
  function init() {
    if (started) return; started = true;
    try {
      split();
      if (reduced) showAll(); else play();
    } catch (err) {
      // never leave the page hidden if something goes wrong
      try { showAll(); } catch (e) {}
      if (window.console) console.error(err);
    }
    document.documentElement.classList.add('ready');   // reveal only now, already in its starting state
  }

  // Wait for the actual Geist faces (not just document.fonts.ready, which can resolve
  // BEFORE the webfont has even started downloading) so line breaks are measured with
  // the real font. On a deployed site the font arrives over the network, which is why
  // this raced and broke the intro there but not locally.
  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all([
      document.fonts.load('400 1em Geist', text),
      document.fonts.load('500 1em Geist', 'Hello!')
    ]).then(function () { return document.fonts.ready; }, function () {});
  }
  fontsReady().then(init);
  setTimeout(init, 2500);   // fallback if the font is slow or blocked

  // On resize, re-detect lines and show the finished state.
  // Only react to WIDTH changes: mobile browsers fire resize (height only) when the
  // address bar collapses/expands, which used to cancel the intro on phones.
  var lastW = innerWidth, rt;
  addEventListener('resize', function () {
    if (innerWidth === lastW) return;
    lastW = innerWidth;
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (!started) return;
      timers.forEach(clearTimeout); timers = [];
      split(); showAll();
    }, 200);
  });
})();
</script>
